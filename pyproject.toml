[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcast"
version = "0.1.0"
description = "asciinema for AI coding agents — replay any Claude Code or Codex session as a shareable HTML file. Zero dependencies."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Jaden Green", email = "jadengreen808@gmail.com"}]
keywords = ["claude-code", "codex", "ai-agents", "replay", "asciinema", "developer-tools", "code-review"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/GreenAiSolution/agentcast"
Demo = "https://greenaisolution.github.io/agentcast/"

[project.scripts]
agentcast = "agentcast.cli:main"

[tool.setuptools]
packages = ["agentcast", "agentcast.parsers"]
