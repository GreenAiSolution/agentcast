name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m unittest discover -s tests -v
      - run: python -m agentcast render tests/fixtures/claude_code_min.jsonl -o out.html && python -m agentcast json tests/fixtures/codex_min.jsonl --compact > /dev/null
        shell: bash
